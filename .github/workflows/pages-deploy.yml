name: Deploy ADTrans RealIndo Preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: adtrans-realindo-pages
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  VITE_BASE_PATH: /ADTrans-RealIndo-IMCS/

jobs:
  build:
    name: Build and verify Vite production artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Verify public boundary
        run: node scripts/verify-public-boundary.mjs
      - name: Verify release source
        run: node scripts/verify-release.mjs
      - name: Verify production artifact
        run: node scripts/verify-dist.mjs
      - name: Verify hosting-path portability
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const base = '/ADTrans-RealIndo-IMCS/';
          for (const file of ['dist/index.html', 'dist/imcs.html']) {
            const html = await readFile(file, 'utf8');
            for (const match of html.matchAll(/(?:src|href)="(\/[^\"]*)"/g)) {
              const url = match[1];
              if (!url.startsWith(base)) {
                throw new Error(`${file} contains an unexpected root-absolute asset URL: ${url}`);
              }
            }
          }
          console.log('PASS  production asset URLs are rooted only at the GitHub Pages project path');
          NODE
      - name: Verify GitHub Pages asset base
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          for (const file of ['dist/index.html', 'dist/imcs.html']) {
            const html = await readFile(file, 'utf8');
            if (!html.includes('/ADTrans-RealIndo-IMCS/')) {
              throw new Error(`${file} is missing the GitHub Pages project base path.`);
            }
            if (!/type="module"[^>]+src="\/ADTrans-RealIndo-IMCS\/assets\/[^\"]+\.js"/.test(html)) {
              throw new Error(`${file} does not contain a Vite module entry under the expected Pages asset path.`);
            }
          }
          console.log('PASS  GitHub Pages module entries use the repository asset base');
          NODE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Deploy verified artifact
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
