<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d0f" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="description" content="ADTrans RealIndo IMCS — secure internal management control system." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>ADTrans RealIndo IMCS</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Dedicated IMCS application surface. Never fall back to the corporate renderer.
      if (location.hash !== '#imcs') location.hash = '#imcs';

      // Vite/GitHub Pages can briefly serve an HTML document that references a previous
      // hashed chunk after a deployment. Reload once when that happens instead of leaving
      // the user on a startup-error screen.
      window.addEventListener('vite:preloadError', (event) => {
        event.preventDefault();
        const key = 'adt-imcs-preload-reload-v3';
        if (!sessionStorage.getItem(key)) {
          sessionStorage.setItem(key, '1');
          location.reload();
        } else {
          sessionStorage.removeItem(key);
        }
      });

      // Prevent implementation/security details from leaking into the login UI.
      const cleanLoginCopy = () => {
        document.querySelectorAll('.login-page .muted').forEach((el) => {
          if (el.textContent.includes('Supabase Auth') || el.textContent.includes('organization-scoped RLS')) el.remove();
        });
      };
      new MutationObserver(cleanLoginCopy).observe(document.documentElement, { childList: true, subtree: true });
      cleanLoginCopy();

      // Runtime diagnostics: never leave a blank IMCS screen when a browser/runtime error occurs.
      window.addEventListener('error', (event) => {
        const app = document.querySelector('#app');
        if (!app || app.children.length) return;
        app.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;background:#0b0d0f;color:#fff;font-family:system-ui;padding:24px"><section style="max-width:760px;border:1px solid #343a40;padding:28px;background:#12171b"><strong style="color:#c7a96b">ADTrans RealIndo IMCS</strong><h1 style="margin:12px 0">Application startup error</h1><p style="color:#b8bec3;line-height:1.7">IMCS gagal memuat modul aplikasi. Silakan refresh halaman. Jika masalah berulang, error runtime sudah ditangkap untuk proses diagnosis.</p><button onclick="location.reload()" style="padding:12px 18px;cursor:pointer">Reload IMCS</button></section></main>';
      });
    </script>
    <script type="module" src="./src/imcs-entry.js?v=20260911-3"></script>
    <script type="module" src="./src/brand-enhancer.js?v=20260911-3"></script>
  </body>
</html>
