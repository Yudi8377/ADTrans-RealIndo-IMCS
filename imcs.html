<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d0f" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="description" content="ADTrans RealIndo IMCS — secure internal management control system." />
    <title>ADTrans RealIndo IMCS</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Dedicated IMCS entry point: never render the public corporate route here.
      if (location.hash !== '#imcs') location.hash = '#imcs';

      // Keep implementation/security details out of the user-facing login screen.
      const cleanLoginCopy = () => {
        document.querySelectorAll('.login-page .muted').forEach((el) => {
          if (el.textContent.includes('Supabase Auth') || el.textContent.includes('organization-scoped RLS')) el.remove();
        });
      };
      new MutationObserver(cleanLoginCopy).observe(document.documentElement, { childList: true, subtree: true });
      cleanLoginCopy();
    </script>
    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/aig.js"></script>
  </body>
</html>
